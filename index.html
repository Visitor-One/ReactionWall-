<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Reaction Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 10%,#17314f 0,#0b1c31 35%,#050b13 100%)}
header{min-height:78px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px}.iconBtn{height:46px;border:1px solid #35506d;border-radius:14px;background:linear-gradient(#1c3047,#0d1927);box-shadow:inset 0 1px #ffffff22,0 5px 10px #0008;font-size:24px}.title{text-align:center;font-weight:900;font-size:clamp(20px,5vw,34px);letter-spacing:.04em}.sub{text-align:center;color:#9eb4ca;font-size:12px;margin-top:2px}
#hud{display:none;padding:0 14px 8px;grid-template-columns:repeat(3,1fr);gap:8px}.hudBox{background:#08111ddd;border:1px solid #29435e;border-radius:12px;padding:7px 8px;text-align:center;box-shadow:inset 0 1px #ffffff12}.hudBox b{display:block;font-size:20px}.hudBox span{font-size:10px;color:#8fa9c1;text-transform:uppercase;letter-spacing:.08em}
#prompt{display:none;min-height:48px;margin:0 14px 8px;border:1px solid #36516e;border-radius:14px;background:#091522dd;align-items:center;justify-content:center;text-align:center;padding:7px;font-weight:900;font-size:clamp(18px,5vw,30px);box-shadow:inset 0 1px #ffffff16}
#menu{flex:1;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:center}.gameCard{min-height:130px;border:1px solid #3a5674;border-radius:22px;background:linear-gradient(145deg,#203a57,#0c1928);box-shadow:inset 0 2px #ffffff1d,inset 0 -5px #0005,0 10px 20px #0007;padding:15px;text-align:left;position:relative}.gameCard:active{transform:translateY(3px);box-shadow:inset 0 2px 8px #0009}.gameCard .emoji{font-size:34px}.gameCard h2{margin:7px 0 3px;font-size:19px}.gameCard p{margin:0;color:#9db2c8;font-size:12px;line-height:1.25}.best{position:absolute;right:12px;top:12px;font-size:11px;color:#ffd66b}
#version{position:fixed;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom));text-align:center;font-size:10px;letter-spacing:.08em;color:#587087;pointer-events:none}#boardWrap{display:none;flex:1;min-height:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));align-items:center;justify-content:center}#board{width:100%;height:100%;display:grid;gap:clamp(7px,1.5vmin,13px);place-content:center}.tile{border:0;border-radius:17%;background:linear-gradient(145deg,#26384a,#0b1420);box-shadow:inset 4px 4px 8px #ffffff12,inset -6px -7px 10px #0008,0 6px 9px #0009;border:1px solid #40536a;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vmin,42px);font-weight:950;text-shadow:0 2px 3px #0009;transition:transform .07s,filter .08s,background .1s}.tile:active{transform:scale(.94)}.tile.lit{filter:brightness(1.45);box-shadow:inset 3px 3px 8px #fff5,inset -5px -6px 9px #0005,0 0 20px currentColor,0 6px 9px #0009}.red{background:linear-gradient(145deg,#ff5b63,#8d1018)!important;color:#ff7077}.green{background:linear-gradient(145deg,#62ef8a,#08772e)!important;color:#65ff93}.blue{background:linear-gradient(145deg,#61aaff,#124d9a)!important;color:#6bb3ff}.yellow{background:linear-gradient(145deg,#ffe96a,#a77900)!important;color:#ffe871}.purple{background:linear-gradient(145deg,#d27aff,#70209c)!important;color:#d782ff}.orange{background:linear-gradient(145deg,#ffad55,#a64800)!important;color:#ffb15d}.cyan{background:linear-gradient(145deg,#5ff6f1,#078782)!important;color:#66fffa}.pink{background:linear-gradient(145deg,#ff78c6,#9c1d66)!important;color:#ff83ca}
#setup{position:fixed;inset:0;background:#02060be8;display:none;align-items:center;justify-content:center;padding:24px;z-index:9}.setupBox{width:min(460px,100%);border:1px solid #3c5875;border-radius:24px;background:linear-gradient(#182b40,#08121e);padding:22px;box-shadow:0 20px 60px #000}.setupBox h2{margin:0 0 16px;text-align:center}.setupLabel{display:block;color:#9fb5ca;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg button,.setupBox select,.setupActions button{height:46px;border:1px solid #46627f;border-radius:13px;background:linear-gradient(#203a55,#0d1d2d);font-weight:800}.seg button.active{background:linear-gradient(#3d77aa,#1b466c);border-color:#78b7ed}.setupBox select{width:100%;padding:0 12px;color:#fff}.setupActions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:18px}.setupActions button:last-child{background:linear-gradient(#3978aa,#17496f)}#overlay{position:fixed;inset:0;background:#02060bdc;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal{width:min(420px,100%);border:1px solid #3c5875;border-radius:24px;background:linear-gradient(#182b40,#08121e);padding:24px;text-align:center;box-shadow:0 20px 60px #000}.modal h2{font-size:30px;margin:0 0 8px}.modal p{color:#abc0d4;line-height:1.4}.modal button{width:100%;height:52px;border:1px solid #54718e;border-radius:15px;background:linear-gradient(#2b5278,#14304b);font-weight:850;margin-top:8px}
@media (orientation:portrait){#board{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);aspect-ratio:4/5;max-height:100%;max-width:100%}}@media (orientation:landscape){header{min-height:60px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:5px}.title{font-size:22px}#hud{position:absolute;top:7px;left:84px;right:84px;padding:0;pointer-events:none}.hudBox{padding:4px}.hudBox b{font-size:16px}#prompt{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:2;min-width:300px;margin:0;min-height:36px;font-size:18px}#menu{grid-template-columns:repeat(5,1fr)}.gameCard{min-height:155px}#boardWrap{padding-top:4px}#board{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);aspect-ratio:5/4;max-height:100%;max-width:100%}}
</style>
</head><body><div id="app">
<header><button id="back" class="iconBtn" style="visibility:hidden">‹</button><div><div class="title">REACTION ARCADE</div><div class="sub" id="subtitle">Wähle ein Spiel</div></div><button id="restart" class="iconBtn" style="visibility:hidden">↻</button></header>
<div id="hud"><div class="hudBox"><b id="score">0</b><span>Punkte</span></div><div class="hudBox"><b id="round">0</b><span>Runde</span></div><div class="hudBox"><b id="errors">0</b><span>Fehler</span></div></div>
<div id="prompt"></div><main id="menu"></main><div id="version">v1.4</div><div id="boardWrap"><div id="board"></div></div></div>
<div id="setup"><div class="setupBox"><h2>⚡ Reaktionsspiel</h2><span class="setupLabel">Spielmodus</span><div class="seg" id="modeSeg"><button data-mode="infinity" class="active">∞ Infinity</button><button data-mode="count">Steine</button><button data-mode="time">Zeit</button></div><div id="countRow" style="display:none"><span class="setupLabel">Anzahl Steine</span><select id="countSel"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></div><div id="timeRow" style="display:none"><span class="setupLabel">Spieldauer</span><select id="timeSel"><option value="30">30 Sekunden</option><option value="60" selected>1 Minute</option><option value="120">2 Minuten</option><option value="180">3 Minuten</option><option value="300">5 Minuten</option></select></div><span class="setupLabel">Zeitspanne für Reaktion</span><select id="reactSel"><option value="500">0,5 Sekunden</option><option value="750">0,75 Sekunden</option><option value="1000" selected>1,0 Sekunde</option><option value="1500">1,5 Sekunden</option><option value="2000">2,0 Sekunden</option><option value="3000">3,0 Sekunden</option></select><div class="setupActions"><button id="setupCancel">Zurück</button><button id="setupStart">Spiel starten</button></div></div></div>
<div id="overlay"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="again">Nochmal</button><button id="home">Spielauswahl</button></div></div>
<script>
const games=[
{id:'reaction',icon:'⚡',name:'Reaktion',desc:'Triff die aufleuchtende Kachel so schnell wie möglich.'},
{id:'color',icon:'🎨',name:'Farbkommando',desc:'Finde die Kachel mit der geforderten Farbe.'},
{id:'simon',icon:'🧠',name:'Simon',desc:'Merke dir die immer längere Lichtfolge.'},
{id:'gonogo',icon:'🚦',name:'Go / No-Go',desc:'Grün drücken. Rot auf keinen Fall.'},
{id:'math',icon:'➗',name:'Rechnen',desc:'Löse Multiplikation und Division per Touch.'},
{id:'hunt',icon:'🔢',name:'Zahlenjagd',desc:'Tippe die Zahlen schnell in richtiger Reihenfolge.'}
];
const menu=document.querySelector('#menu'),board=document.querySelector('#board'),wrap=document.querySelector('#boardWrap'),hud=document.querySelector('#hud'),promptEl=document.querySelector('#prompt'),back=document.querySelector('#back'),restart=document.querySelector('#restart'),subtitle=document.querySelector('#subtitle'),versionEl=document.querySelector('#version');
let current=null,score=0,round=0,errors=0,timers=[],locked=false,simonSeq=[],simonPos=0,huntNext=1;let reactionCfg={mode:'infinity',count:20,duration:60,window:1000},reactionStarted=0,reactionDeadline=null,reactionWatch=null,reactionLitAt=0,reactionTimes=[];
function best(id){return +localStorage.getItem('ra_best_'+id)||0}function renderMenu(){current=null;clearTimers();board.innerHTML='';wrap.style.display='none';hud.style.display='none';promptEl.style.display='none';menu.style.display='grid';back.style.visibility=restart.style.visibility='hidden';subtitle.textContent='Wähle ein Spiel';versionEl.style.display='block';menu.innerHTML=games.map(g=>`<button class="gameCard" data-id="${g.id}"><span class="best">BEST ${best(g.id)}</span><div class="emoji">${g.icon}</div><h2>${g.name}</h2><p>${g.desc}</p></button>`).join('');document.querySelectorAll('.gameCard').forEach(x=>x.onclick=()=>x.dataset.id==='reaction'?openReactionSetup():start(x.dataset.id))}
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];reactionWatch=null}function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}function reactionTime(){let ms=Math.max(0,Date.now()-reactionStarted),m=Math.floor(ms/60000),sec=Math.floor(ms%60000/1000),d=Math.floor(ms%1000/100);roundEl.textContent=`${m}:${String(sec).padStart(2,'0')}.${d}`}function stats(){scoreEl.textContent=score;if(current==='reaction')reactionTime();else roundEl.textContent=round;errorsEl.textContent=errors}const scoreEl=document.querySelector('#score'),roundEl=document.querySelector('#round'),errorsEl=document.querySelector('#errors');
function makeBoard(){board.innerHTML='';for(let i=0;i<20;i++){let b=document.createElement('button');b.className='tile';b.dataset.i=i;b.onclick=()=>tap(i,b);board.appendChild(b)}sizeBoard()}function sizeBoard(){requestAnimationFrame(()=>{let r=wrap.getBoundingClientRect(),portrait=innerHeight>=innerWidth,ratio=portrait?4/5:5/4,w=r.width,h=r.height;if(w/h>ratio)w=h*ratio;else h=w/ratio;board.style.width=w+'px';board.style.height=h+'px'})}addEventListener('resize',sizeBoard);
function start(id){versionEl.style.display='none';current=id;score=round=errors=0;simonSeq=[];locked=false;menu.style.display='none';wrap.style.display='flex';hud.style.display='grid';promptEl.style.display='flex';back.style.visibility=restart.style.visibility='visible';subtitle.textContent=games.find(g=>g.id===id).name;document.querySelector('#round').nextElementSibling.textContent=id==='reaction'?'Zeit':'Runde';if(id==='reaction'){reactionStarted=Date.now();reactionTimes=[];reactionLitAt=0;reactionWatch=setInterval(()=>{if(current==='reaction')reactionTime()},50);timers.push(reactionWatch)}makeBoard();stats();next()}
function resetTiles(){[...board.children].forEach(t=>{t.className='tile';t.textContent='';t.dataset.role=''})}function rnd(n){return Math.floor(Math.random()*n)}function shuffle(a){return a.sort(()=>Math.random()-.5)}
const colors=[['ROT','red'],['GRÜN','green'],['BLAU','blue'],['GELB','yellow'],['LILA','purple'],['ORANGE','orange'],['TÜRKIS','cyan'],['PINK','pink']];
function next(){clearTimers();locked=false;if(current==='reaction')reactionRound();if(current==='color')colorRound();if(current==='simon')simonRound();if(current==='gonogo')goRound();if(current==='math')mathRound();if(current==='hunt')huntRound()}
function reactionRound(){if(reactionCfg.mode==='count'&&round>=reactionCfg.count)return finish('Geschafft',`${reactionCfg.count} Steine abgeschlossen.`);if(reactionCfg.mode==='time'&&Date.now()-reactionStarted>=reactionCfg.duration*1000)return finish('Zeit abgelaufen',`${reactionCfg.duration} Sekunden gespielt.`);round++;stats();resetTiles();locked=true;let delay=round===1?350+rnd(900):0;later(()=>{if(current!=='reaction')return;if(reactionCfg.mode==='time'&&Date.now()-reactionStarted>=reactionCfg.duration*1000)return finish('Zeit abgelaufen',`${reactionCfg.duration} Sekunden gespielt.`);let idx=rnd(20),t=board.children[idx];t.classList.add('green','lit');t.dataset.role='reaction';reactionLitAt=performance.now();promptEl.textContent='JETZT!';locked=false;reactionDeadline=later(()=>{if(current!=='reaction'||locked||t.dataset.role!=='reaction')return;locked=true;errors++;stats();t.className='tile';t.dataset.role='';next()},reactionCfg.window)},delay)}
function colorRound(){round++;stats();resetTiles();let opts=shuffle([...colors]).slice(0,Math.min(4+Math.floor(round/4),8)),target=opts[rnd(opts.length)];promptEl.textContent='Tippe: '+target[0];let spots=shuffle([...Array(20).keys()]).slice(0,opts.length);opts.forEach((c,j)=>{let t=board.children[spots[j]];t.classList.add(c[1],'lit');t.dataset.role=c===target?'right':'wrong'});}
function simonRound(){round++;stats();resetTiles();promptEl.textContent='Merken …';locked=true;simonSeq.push(rnd(20));let p=0;function show(){if(p>=simonSeq.length){locked=false;simonPos=0;promptEl.textContent='Jetzt nachtippen';return}let t=board.children[simonSeq[p]];t.classList.add('blue','lit');later(()=>{t.className='tile';p++;later(show,180)},420)}later(show,450)}
function goRound(){round++;stats();resetTiles();let go=Math.random()<.7,idx=rnd(20),t=board.children[idx];promptEl.textContent=go?'GO!':'NO-GO!';t.classList.add(go?'green':'red','lit');t.dataset.role=go?'go':'nogo';locked=false;later(()=>{if(current!=='gonogo'||locked)return;locked=true;if(go){errors++;stats()}later(next,300)},Math.max(450,1100-round*18))}
function mathRound(){round++;stats();resetTiles();let mult=Math.random()<.5,a,b,ans;if(mult){a=2+rnd(11);b=2+rnd(11);ans=a*b;promptEl.textContent=`${a} × ${b} = ?`}else{b=2+rnd(11);ans=2+rnd(11);a=b*ans;promptEl.textContent=`${a} ÷ ${b} = ?`}let vals=new Set([ans]);while(vals.size<6){let v=Math.max(1,ans+rnd(15)-7);vals.add(v)}let arr=shuffle([...vals]),spots=shuffle([...Array(20).keys()]).slice(0,6);arr.forEach((v,j)=>{let t=board.children[spots[j]];t.textContent=v;t.dataset.role=v===ans?'right':'wrong'});}
function huntRound(){round++;stats();resetTiles();let count=Math.min(8+round,20);huntNext=1;promptEl.textContent=`1 → ${count}`;let nums=shuffle([...Array(count)].map((_,i)=>i+1)),spots=shuffle([...Array(20).keys()]).slice(0,count);nums.forEach((v,j)=>{let t=board.children[spots[j]];t.textContent=v;t.dataset.role='hunt';t.dataset.num=v})}
function tap(i,t){if(!current||locked)return;if(current==='reaction'){if(t.dataset.role==='reaction'){locked=true;clearTimeout(reactionDeadline);t.className='tile';t.dataset.role='';reactionTimes.push(performance.now()-reactionLitAt);score++;stats();next()}return;}if(current==='color'||current==='math'){if(t.dataset.role==='right'){score++;locked=true;t.classList.add('green','lit');stats();later(next,250)}else if(t.dataset.role){errors++;score=Math.max(0,score-1);t.classList.add('red','lit');stats()}}
else if(current==='simon'){if(i===simonSeq[simonPos]){t.classList.add('green','lit');later(()=>t.className='tile',130);simonPos++;if(simonPos===simonSeq.length){score+=round;locked=true;stats();later(next,450)}}else{errors++;stats();finish('Falsche Reihenfolge',`Du hast Runde ${round} erreicht.`)}}
else if(current==='gonogo'){if(t.dataset.role==='go'){locked=true;score++;stats();later(next,220)}else if(t.dataset.role==='nogo'){locked=true;errors++;stats();later(next,450)}}
else if(current==='hunt'&&t.dataset.role==='hunt'){let n=+t.dataset.num;if(n===huntNext){t.textContent='';t.dataset.role='';t.classList.add('green');huntNext++;score++;stats();let total=[...board.children].filter(x=>x.dataset.role==='hunt').length;if(!total){locked=true;later(next,300)}}else{errors++;stats();t.classList.add('red');later(()=>t.classList.remove('red'),180)}}}
function formatElapsed(ms){let m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),d=Math.floor(ms%1000/100);return `${m}:${String(s).padStart(2,'0')}.${d}`}function finish(title,text){let elapsed=Math.max(0,Date.now()-reactionStarted);clearTimers();locked=true;if(score>best(current))localStorage.setItem('ra_best_'+current,score);document.querySelector('#modalTitle').textContent=title;if(current==='reaction'){let bestRt=reactionTimes.length?Math.min(...reactionTimes):null,avgRt=reactionTimes.length?reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length:null;document.querySelector('#modalText').innerHTML=`${text}<br><br><b>Auswertung</b><br>Gebrauchte Zeit: ${formatElapsed(elapsed)}<br>Beste Reaktionszeit: ${bestRt===null?'–':Math.round(bestRt)+' ms'}<br>Ø Reaktionszeit: ${avgRt===null?'–':Math.round(avgRt)+' ms'}<br>Treffer: ${score} · Fehler: ${errors}`}else document.querySelector('#modalText').textContent=text+` Punkte: ${score} · Fehler: ${errors}`;document.querySelector('#overlay').style.display='flex'}
function openReactionSetup(){document.querySelector('#setup').style.display='flex';versionEl.style.display='none'}
const setup=document.querySelector('#setup'),modeSeg=document.querySelector('#modeSeg'),countRow=document.querySelector('#countRow'),timeRow=document.querySelector('#timeRow');
modeSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{modeSeg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');reactionCfg.mode=b.dataset.mode;countRow.style.display=reactionCfg.mode==='count'?'block':'none';timeRow.style.display=reactionCfg.mode==='time'?'block':'none'});
document.querySelector('#setupCancel').onclick=()=>{setup.style.display='none';versionEl.style.display='block'};
document.querySelector('#setupStart').onclick=()=>{reactionCfg.count=+document.querySelector('#countSel').value;reactionCfg.duration=+document.querySelector('#timeSel').value;reactionCfg.window=+document.querySelector('#reactSel').value;setup.style.display='none';start('reaction')};
back.onclick=renderMenu;restart.onclick=()=>current==='reaction'?openReactionSetup():start(current);document.querySelector('#again').onclick=()=>{document.querySelector('#overlay').style.display='none';start(current)};document.querySelector('#home').onclick=()=>{document.querySelector('#overlay').style.display='none';renderMenu()};
renderMenu();
</script></body></html>
