<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reaction Wall</title>
<style>
:root{
  --bg:#070a10; --panel:#101620; --text:#eef4ff; --muted:#8995a8;
  --gap:clamp(8px,1.7vmin,16px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{touch-action:manipulation}
button,input,select{font:inherit}
#app{
  height:100dvh; display:flex; flex-direction:column; gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  background:
    radial-gradient(circle at 50% -10%,#1c2939 0,#0b1018 34%,#05070b 72%);
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{font-weight:900;letter-spacing:.09em;font-size:clamp(18px,4vw,28px)}
.brand span{color:#7bdcff}
.stats{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.stat{min-width:66px;padding:6px 9px;border-radius:11px;text-align:center;background:#0e151f;
border:1px solid #263241;box-shadow:inset 0 1px 0 #ffffff0d,0 5px 15px #0007}
.stat b{display:block;font-size:clamp(15px,3.5vw,21px);line-height:1.05}
.stat small{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#wallWrap{position:relative;flex:1;min-height:0;border-radius:22px;padding:clamp(10px,2vmin,18px);
background:linear-gradient(145deg,#111823,#080c12);border:1px solid #283443;
box-shadow:inset 0 0 45px #000b,0 18px 45px #0009;overflow:hidden}
#wall{
  width:100%;height:100%;display:grid;gap:var(--gap);perspective:900px;
  align-content:center;justify-content:center;
}
.tile{
  position:relative;border:0;border-radius:clamp(10px,2.2vmin,20px);padding:0;cursor:pointer;
  background:linear-gradient(145deg,#202a36,#0b1017 62%);
  box-shadow:
    inset 3px 3px 5px #ffffff0c,
    inset -7px -8px 14px #000b,
    0 7px 0 #030507,
    0 11px 18px #000b;
  transform:translateY(-2px) rotateX(1deg);
  transition:transform .07s,box-shadow .09s,filter .09s,background .09s;
}
.tile:after{content:"";position:absolute;inset:9%;border-radius:inherit;
background:linear-gradient(145deg,#ffffff0b,#0005);box-shadow:inset 0 0 18px #0008}
.tile.active{
  background:radial-gradient(circle at 38% 30%,#fff 0 2%,var(--c) 13%,var(--c) 52%,#111 115%);
  box-shadow:0 0 12px var(--c),0 0 35px var(--c),0 0 70px color-mix(in srgb,var(--c) 55%,transparent),
             inset 3px 3px 8px #fff8,inset -8px -10px 18px #0007,0 7px 0 #030507;
  filter:saturate(1.25) brightness(1.15);
  transform:translateY(-4px) scale(1.018);
}
.tile.active:after{background:linear-gradient(145deg,#ffffff42,#ffffff00 38%,#0003);box-shadow:none}
.tile.hit{transform:translateY(5px) scale(.96);filter:brightness(1.8)}
.tile.wrong{animation:wrong .18s 2}
@keyframes wrong{50%{transform:translateY(2px) scale(.96);filter:brightness(1.6)}}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;
background:#05080dbf;backdrop-filter:blur(8px);z-index:5}
#overlay.hidden{display:none}
.card{width:min(560px,100%);max-height:100%;overflow:auto;border-radius:24px;padding:20px;
background:linear-gradient(145deg,#182231,#0b111a);border:1px solid #334255;
box-shadow:inset 0 1px 0 #ffffff18,0 25px 60px #000c}
.card h1{margin:0 0 4px;font-size:clamp(28px,8vw,48px);letter-spacing:-.04em}
.card p{margin:0 0 16px;color:#aab5c5}
.modeRow,.choiceRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0}
.choiceRow{grid-template-columns:repeat(4,1fr)}
.opt,.primary,.secondary{
border:1px solid #344356;color:#eaf4ff;background:#111a26;border-radius:13px;padding:11px 8px;font-weight:800}
.opt.selected{background:#20364a;border-color:#70d7ff;box-shadow:0 0 0 1px #70d7ff55 inset}
label{display:block;color:#aab5c5;font-size:12px;margin-top:13px;margin-bottom:5px}
input[type=range]{width:100%;accent-color:#75dcff}
.valueLine{display:flex;justify-content:space-between;align-items:center}
.primary{width:100%;margin-top:16px;padding:15px;background:linear-gradient(180deg,#52cfff,#168bc3);
border-color:#70dcff;color:#031019;font-size:17px;box-shadow:0 8px 24px #168bc344}
.secondary{width:100%;margin-top:8px}
#result{display:none}
#result.show{display:block}
.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.resultBox{background:#0c131d;border:1px solid #29384a;border-radius:14px;padding:12px;text-align:center}
.resultBox b{font-size:24px;display:block}.resultBox small{color:#8e9bad}
#countdown{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:#05080dc7;
font-size:min(30vw,180px);font-weight:1000;text-shadow:0 10px 40px #000}
#countdown.show{display:grid}
#stopBtn{display:none;position:absolute;right:12px;bottom:12px;z-index:3;border:1px solid #ffffff25;
background:#080c12cc;color:#b9c4d3;border-radius:12px;padding:8px 12px;font-weight:800}
#stopBtn.show{display:block}
@media(max-width:650px){
  header{min-height:42px}.brand{font-size:16px}.stat{min-width:55px;padding:5px 6px}.stat:nth-child(4){display:none}
  .card{padding:16px}.choiceRow{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">REACTION <span>WALL</span></div>
  <div class="stats">
    <div class="stat"><b id="hits">0</b><small>Treffer</small></div>
    <div class="stat"><b id="misses">0</b><small>Fehler</small></div>
    <div class="stat"><b id="avg">—</b><small>Ø ms</small></div>
    <div class="stat"><b id="best">—</b><small>Best ms</small></div>
    <div class="stat"><b id="remaining">∞</b><small id="remainingLabel">Rest</small></div>
  </div>
</header>
<div id="wallWrap">
  <div id="wall"></div>
  <button id="stopBtn">Beenden</button>
  <div id="countdown"></div>
  <div id="overlay">
    <div class="card">
      <div id="setup">
        <h1>Reaction Wall</h1>
        <p>Triff die leuchtende Kachel so schnell wie möglich.</p>
        <label>SPIELMODUS</label>
        <div class="modeRow">
          <button class="opt mode selected" data-mode="infinity">∞ Infinity</button>
          <button class="opt mode" data-mode="time">⏱ Zeit</button>
          <button class="opt mode" data-mode="count">🎯 Anzahl</button>
        </div>

        <label>SPIELFELD</label>
        <div class="choiceRow">
          <button class="opt grid" data-short="3" data-long="3">3 × 3</button>
          <button class="opt grid selected" data-short="4" data-long="4">4 × 4</button>
          <button class="opt grid" data-short="4" data-long="5">4 × 5</button>
          <button class="opt grid" data-short="5" data-long="6">5 × 6</button>
        </div>

        <div id="timeSetting" style="display:none">
          <label>SPIELZEIT</label>
          <div class="valueLine"><span>Dauer</span><b><span id="timeVal">60</span> s</b></div>
          <input id="timeRange" type="range" min="10" max="180" step="10" value="60">
        </div>
        <div id="countSetting" style="display:none">
          <label>ANZAHL KACHELN</label>
          <div class="valueLine"><span>Ziele</span><b id="countVal">30</b></div>
          <input id="countRange" type="range" min="5" max="100" step="5" value="30">
        </div>

        <label>MAXIMALE REAKTIONSZEIT</label>
        <div class="valueLine"><span>Zeit pro Kachel</span><b><span id="reactionVal">2.0</span> s</b></div>
        <input id="reactionRange" type="range" min="500" max="5000" step="100" value="2000">

        <button id="startBtn" class="primary">SPIEL STARTEN</button>
      </div>

      <div id="result">
        <h1>Fertig!</h1>
        <p id="resultText">Dein Ergebnis</p>
        <div class="resultGrid">
          <div class="resultBox"><b id="rHits">0</b><small>Treffer</small></div>
          <div class="resultBox"><b id="rMiss">0</b><small>Fehler</small></div>
          <div class="resultBox"><b id="rAvg">—</b><small>Ø Reaktion</small></div>
          <div class="resultBox"><b id="rBest">—</b><small>Beste Reaktion</small></div>
        </div>
        <button id="againBtn" class="primary">NOCHMAL</button>
        <button id="menuBtn" class="secondary">Einstellungen</button>
      </div>
    </div>
  </div>
</div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const wall=$("#wall"), overlay=$("#overlay"), countdown=$("#countdown");
const colors=["#ff354d","#26d8ff","#54f27b","#ffd633","#b968ff","#ff7b2f","#ff4fd8"];
let cfg={mode:"infinity",rows:4,cols:4,time:60,count:30,reaction:2000};
let playing=false, active=-1, activeAt=0, targetTimer=null, gameTimer=null, timeTicker=null;
let hits=0, misses=0, reactions=[], completed=0, deadline=0, last=-1;

function buildWall(){
  wall.innerHTML="";
  const gap=parseFloat(getComputedStyle(wall).gap)||10;
  const w=wall.clientWidth, h=wall.clientHeight;
  const cell=Math.max(20,Math.floor(Math.min(
    (w-gap*(cfg.cols-1))/cfg.cols,
    (h-gap*(cfg.rows-1))/cfg.rows
  )));
  wall.style.gridTemplateColumns=`repeat(${cfg.cols},${cell}px)`;
  wall.style.gridTemplateRows=`repeat(${cfg.rows},${cell}px)`;
  for(let i=0;i<cfg.rows*cfg.cols;i++){
    let b=document.createElement("button"); b.className="tile"; b.dataset.i=i;
    b.addEventListener("pointerdown",()=>tap(i,b));
    wall.appendChild(b);
  }
}
function updateStats(){
  $("#hits").textContent=hits; $("#misses").textContent=misses;
  $("#avg").textContent=reactions.length?Math.round(reactions.reduce((a,b)=>a+b,0)/reactions.length):"—";
  $("#best").textContent=reactions.length?Math.min(...reactions):"—";
  if(cfg.mode==="count") $("#remaining").textContent=Math.max(0,cfg.count-completed);
  else if(cfg.mode==="time") $("#remaining").textContent=Math.max(0,Math.ceil((deadline-performance.now())/1000));
  else $("#remaining").textContent="∞";
}
function clearActive(){
  if(active>=0) wall.children[active]?.classList.remove("active","hit");
  active=-1; clearTimeout(targetTimer);
}
function nextTarget(){
  if(!playing)return;
  clearActive();
  let n=cfg.rows*cfg.cols, i;
  do{i=Math.floor(Math.random()*n)}while(n>1&&i===last);
  last=i; active=i;
  let tile=wall.children[i], c=colors[Math.floor(Math.random()*colors.length)];
  tile.style.setProperty("--c",c); tile.classList.add("active");
  activeAt=performance.now();
  targetTimer=setTimeout(()=>{
    if(!playing||active!==i)return;
    misses++; completed++; clearActive(); updateStats();
    if(cfg.mode==="count"&&completed>=cfg.count) finish();
    else setTimeout(nextTarget,120);
  },cfg.reaction);
}
function tap(i,tile){
  if(!playing)return;
  if(i===active){
    let rt=Math.round(performance.now()-activeAt);
    reactions.push(rt); hits++; completed++;
    tile.classList.add("hit"); clearTimeout(targetTimer); active=-1; updateStats();
    if(cfg.mode==="count"&&completed>=cfg.count) setTimeout(finish,100);
    else setTimeout(()=>{tile.classList.remove("active","hit");nextTarget()},90);
  }else{
    misses++; tile.classList.remove("wrong"); void tile.offsetWidth; tile.classList.add("wrong"); updateStats();
  }
}
function reset(){
  clearTimeout(targetTimer);clearTimeout(gameTimer);clearInterval(timeTicker);
  hits=misses=completed=0;reactions=[];last=-1;active=-1;updateStats();buildWall();
}
async function start(){
  reset(); overlay.classList.add("hidden"); $("#stopBtn").classList.add("show");
  countdown.classList.add("show");
  for(const x of ["3","2","1"]){countdown.textContent=x;await new Promise(r=>setTimeout(r,600))}
  countdown.textContent="GO!";await new Promise(r=>setTimeout(r,350));countdown.classList.remove("show");
  playing=true;
  if(cfg.mode==="time"){
    deadline=performance.now()+cfg.time*1000;
    gameTimer=setTimeout(finish,cfg.time*1000);
    timeTicker=setInterval(updateStats,200);
  }
  updateStats();nextTarget();
}
function finish(){
  if(!playing && completed===0)return;
  playing=false;clearActive();clearTimeout(gameTimer);clearInterval(timeTicker);
  $("#stopBtn").classList.remove("show");
  $("#rHits").textContent=hits;$("#rMiss").textContent=misses;
  $("#rAvg").textContent=reactions.length?Math.round(reactions.reduce((a,b)=>a+b,0)/reactions.length)+" ms":"—";
  $("#rBest").textContent=reactions.length?Math.min(...reactions)+" ms":"—";
  $("#resultText").textContent=`${hits+misses} Aktionen · ${hits+misses?Math.round(hits/(hits+misses)*100):0}% Trefferquote`;
  $("#setup").style.display="none";$("#result").classList.add("show");overlay.classList.remove("hidden");
}
$$(".mode").forEach(b=>b.onclick=()=>{
  $$(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");cfg.mode=b.dataset.mode;
  $("#timeSetting").style.display=cfg.mode==="time"?"block":"none";
  $("#countSetting").style.display=cfg.mode==="count"?"block":"none";
});
function applySelectedGrid(){
  const b=$(".grid.selected");
  if(!b)return;
  const a=+b.dataset.short, z=+b.dataset.long;
  const portrait=window.innerHeight>=window.innerWidth;
  cfg.rows=portrait?z:a;
  cfg.cols=portrait?a:z;
  buildWall();
}
$$(".grid").forEach(b=>b.onclick=()=>{
  $$(".grid").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
  applySelectedGrid();
});
$("#timeRange").oninput=e=>{cfg.time=+e.target.value;$("#timeVal").textContent=cfg.time};
$("#countRange").oninput=e=>{cfg.count=+e.target.value;$("#countVal").textContent=cfg.count};
$("#reactionRange").oninput=e=>{cfg.reaction=+e.target.value;$("#reactionVal").textContent=(cfg.reaction/1000).toFixed(1)};
$("#startBtn").onclick=start;$("#stopBtn").onclick=finish;
$("#againBtn").onclick=()=>{$("#result").classList.remove("show");$("#setup").style.display="block";start()};
$("#menuBtn").onclick=()=>{$("#result").classList.remove("show");$("#setup").style.display="block"};
window.addEventListener("resize",()=>{ applySelectedGrid(); });
applySelectedGrid();updateStats();
</script>
</body>
</html>
